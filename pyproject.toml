[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "noesis"
version = "0.1.23"
description = "Unified CLI for markdown chats with LLMs."
readme = "noesis/README.md"
requires-python = ">=3.11"
dependencies = [
  "anthropic>=0.40.0",
  "platformdirs>=4.0.0",
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "mcp>=2.3,<3",
  "pyjwt[crypto]>=2.8",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0.0",
  "httpx>=0.27.0",
]

[project.scripts]
noesis = "noesis.cli:main"

[tool.setuptools]
packages = ["noesis"]

[tool.setuptools.package-data]
noesis = ["*.toml", "*.md", "deployed.json", "web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
