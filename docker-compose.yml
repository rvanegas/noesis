services:
  noesis:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    # System-wide config from the image; one asset cache for the server's API
    # key. Libraries are /data/libraries/<user>/<library>, each with its own
    # .noesis/ state (SERVER.md).
    environment:
      NOESIS_CONFIG_DIR: /etc/noesis
      NOESIS_CACHE_DIR: /data/cache
    # The box's deploy user (ubuntu), which owns /srv/noesis, so files written
    # into the libraries stay editable from the host.
    user: "1000:1000"
    volumes:
      - /srv/noesis:/data
    # commons is a 2 GB box shared with dianoia, imitation and the site: open
    # sign-up must not let noesis's runs starve them (SERVER.md, Phase 6).
    mem_limit: 1g
    # Loopback only: Caddy on the box is the one public front door
    # (rvanegas-site's Caddyfile).
    ports:
      - "127.0.0.1:8001:8001"
